name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  apple-silicon:
    name: Build and test on Apple Silicon
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run i18n -- --strict
      - run: npm run build
      - run: npm test
      - run: cargo test --release --locked --manifest-path native/Cargo.toml
      - run: npm --prefix server test
      - run: npm pack --ignore-scripts
