# SubCast shared transcripts API.
# Include inside the HTTPS server block of /www/server/panel/vhost/nginx/subcast.qiaomu.ai.conf.
# Nginx passes the full /api/... path through; the Node server handles the /api prefix itself.

location /api/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";
    proxy_read_timeout 60s;

    # JSON responses change after every upload; never serve stale hits.
    proxy_cache off;

    # 6 MB raw request bodies (the app sends gzip-compressed JSON).
    client_max_body_size 6m;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;
    gzip_vary on;
}
