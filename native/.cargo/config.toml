# Windows: link the C/C++ runtime into subcast.exe (whisper.cpp is C++), so it starts on PCs without the
# Visual C++ Redistributable ("MSVCP140.dll was not found"). The cmake crate follows this for native code too.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
[target.aarch64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
